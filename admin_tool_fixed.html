
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星界聊天系统 - 管理工具 - DeepLora团队</title>
    <style>
        :root {
            --primary: #00ff88;
            --primary-dark: #00cc6a;
            --secondary: #6c63ff;
            --background: #0a0a0f;
            --surface: #1a1a2e;
            --surface-light: #2d2d44;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --error: #ff4757;
            --warning: #ffa502;
            --success: #2ed573;
            --info: #1e90ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: var(--surface);
            border-right: 1px solid var(--surface-light);
            padding: 20px 0;
        }

        .logo {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid var(--surface-light);
            margin-bottom: 20px;
        }

        .logo h1 {
            color: var(--primary);
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            padding: 15px 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--surface-light);
        }

        .nav-item.active {
            background: var(--surface-light);
            border-left-color: var(--primary);
            color: var(--primary);
        }

        .nav-icon {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        /* 内容区域 */
        .content-section {
            background: var(--surface);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--surface-light);
        }

        .section-header h3 {
            color: var(--primary);
        }

        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .data-table th,
        .data-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--surface-light);
        }

        .data-table th {
            background: var(--surface-light);
            color: var(--primary);
            font-weight: 600;
        }

        .data-table tr:hover {
            background: var(--surface-light);
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--background);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: 1px solid var(--surface-light);
            border-radius: 6px;
            color: var(--text);
            font-size: 1em;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        .search-box {
            position: relative;
            max-width: 300px;
        }

        .search-box input {
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* 状态标签 */
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-online {
            background: var(--success);
            color: white;
        }

        .status-offline {
            background: var(--text-secondary);
            color: white;
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: var(--surface);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }

        .notification.error {
            border-left-color: var(--error);
        }

        .notification.success {
            border-left-color: var(--success);
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--surface-light);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--surface-light);
        }

        .modal-title {
            color: var(--primary);
            font-size: 1.3em;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--surface-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <h1>星界聊天系统</h1>
                <div class="subtitle">管理工具</div>
                <div class="dev-team" style="margin-top: 10px; font-size: 0.8em; color: var(--text-secondary);">
                    DeepLora团队
                </div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item active" data-target="dashboard">
                    <span class="nav-icon">📊</span>
                    数据概览
                </li>
                <li class="nav-item" data-target="users">
                    <span class="nav-icon">👥</span>
                    用户管理
                </li>
                <li class="nav-item" data-target="servers">
                    <span class="nav-icon">🏠</span>
                    服务器管理
                </li>
                <li class="nav-item" data-target="messages">
                    <span class="nav-icon">💬</span>
                    消息统计
                </li>
            </ul>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 数据概览 -->
            <div class="content-section active" id="dashboard">
                <div class="header">
                    <h2>数据概览</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="refreshAllData()">
                            <span>🔄</span> 刷新数据
                        </button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalUsers">0</div>
                        <div class="stat-label">总用户数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="onlineUsers">0</div>
                        <div class="stat-label">在线用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalServers">0</div>
                        <div class="stat-label">服务器数量</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="activeChats">0</div>
                        <div class="stat-label">活跃聊天</div>
                    </div>
                </div>

                <div class="section-header">
                    <h3>实时状态</h3>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="serverStatus">运行中</div>
                        <div class="stat-label">服务器状态</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="apiStatus">正常</div>
                        <div class="stat-label">API状态</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="uptime">0小时</div>
                        <div class="stat-label">运行时间</div>
                    </div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div class="content-section" id="users">
                <div class="header">
                    <h2>用户管理</h2>
                    <div class="btn-group">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" class="form-control" id="userSearch" placeholder="搜索用户..." oninput="searchUsers()">
                        </div>
                        <button class="btn btn-primary" onclick="showAddUserModal()">
                            <span>➕</span> 添加用户
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>状态</th>
                                <th>注册时间</th>
                                <th>最后登录</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable">
                            <tr>
                                <td colspan="7" class="loading">
                                    <div class="spinner"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 服务器管理 -->
            <div class="content-section" id="servers">
                <div class="header">
                    <h2>服务器管理</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="showCreateServerModal()">
                            <span>➕</span> 创建服务器
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>服务器名称</th>
                                <th>创建者</th>
                                <th>用户数</th>
                                <th>加密</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="serversTable">
                            <tr>
                                <td colspan="7" class="loading">
                                    <div class="spinner"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 消息统计 -->
            <div class="content-section" id="messages">
                <div class="header">
                    <h2>消息统计</h2>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="loadMessagesStats()">
                            <span>🔄</span> 刷新统计
                        </button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalMessages">0</div>
                        <div class="stat-label">总消息数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="todayMessages">0</div>
                        <div class="stat-label">今日消息</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="privateMessages">0</div>
                        <div class="stat-label">私聊消息</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="publicMessages">0</div>
                        <div class="stat-label">公共消息</div>
                    </div>
                </div>

                <div class="section-header">
                    <h3>服务器消息分布</h3>
                </div>
                <div id="serverMessagesStats" class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加用户模态框 -->
    <div class="modal" id="addUserModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">添加用户</div>
                <button class="close-btn" onclick="hideModal('addUserModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-control" id="newUsername" placeholder="输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-control" id="newPassword" placeholder="输入密码">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" class="form-control" id="newEmail" placeholder="输入邮箱">
            </div>
            <div class="btn-group" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="addUser()">添加用户</button>
                <button class="btn btn-secondary" onclick="hideModal('addUserModal')">取消</button>
            </div>
        </div>
    </div>

    <!-- 创建服务器模态框 -->
    <div class="modal" id="createServerModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">创建服务器</div>
                <button class="close-btn" onclick="hideModal('createServerModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>服务器名称</label>
                <input type="text" class="form-control" id="newServerName" placeholder="输入服务器名称">
            </div>
            <div class="form-group">
                <label>描述</label>
                <textarea class="form-control" id="newServerDescription" placeholder="输入服务器描述" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="newServerEncrypted" onchange="togglePasswordField()"> 加密服务器
                </label>
            </div>
            <div class="form-group" id="newServerPasswordField" style="display: none;">
                <label>密码</label>
                <input type="password" class="form-control" id="newServerPassword" placeholder="输入服务器密码">
            </div>
            <div class="btn-group" style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="createServer()">创建服务器</button>
                <button class="btn btn-secondary" onclick="hideModal('createServerModal')">取消</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:9074/api';
        let allUsers = [];
        let allServers = [];

        // 页面导航
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // 更新活动状态
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                
                // 显示对应内容
                const target = this.getAttribute('data-target');
                document.querySelectorAll('.content-section').forEach(section => {
                    section.classList.remove('active');
                });
                document.getElementById(target).classList.add('active');
                
                // 加载对应数据
                loadSectionData(target);
            });
        });

        // 加载区域数据
        function loadSectionData(section) {
            switch(section) {
                case 'dashboard':
                    loadDashboardData();
                    break;
                case 'users':
                    loadUsersData();
                    break;
                case 'servers':
                    loadServersData();
                    break;
                case 'messages':
                    loadMessagesStats();
                    break;
            }
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 模态框控制
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function togglePasswordField() {
            const passwordField = document.getElementById('newServerPasswordField');
            passwordField.style.display = document.getElementById('newServerEncrypted').checked ? 'block' : 'none';
        }

        // 数据概览
        async function loadDashboardData() {
            try {
                const response = await fetch(`${API_BASE}/admin/stats`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('totalUsers').textContent = stats.total_users;
                    document.getElementById('onlineUsers').textContent = stats.online_users;
                    document.getElementById('totalServers').textContent = stats.total_servers;
                    document.getElementById('activeChats').textContent = stats.active_chats;
                    document.getElementById('serverStatus').textContent = stats.system_status;
                    document.getElementById('apiStatus').textContent = stats.api_status;
                    document.getElementById('uptime').textContent = stats.uptime;
                } else {
                    showNotification('加载统计数据失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('加载数据失败: ' + error.message, 'error');
                document.getElementById('apiStatus').textContent = '异常';
            }
        }

        // 用户管理 - 使用新的API
        async function loadUsersData() {
            try {
                const response = await fetch(`${API_BASE}/admin/users`);
                const data = await response.json();

                if (data.success) {
                    allUsers = data.users;
                    displayUsers(allUsers);
                } else {
                    document.getElementById('usersTable').innerHTML = '<tr><td colspan="7" class="empty-state">加载用户数据失败: ' + data.message + '</td></tr>';
                }
            } catch (error) {
                document.getElementById('usersTable').innerHTML = `
                    <tr><td colspan="7" class="empty-state">加载失败: ${error.message}</td></tr>
                `;
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('usersTable');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无用户数据</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id.substring(0, 8)}...</td>
                    <td>${user.username}</td>
                    <td>${user.email || '未设置'}</td>
                    <td><span class="status-badge ${user.online ? 'status-online' : 'status-offline'}">${user.online ? '在线' : '离线'}</span></td>
                    <td>${new Date(user.created_at).toLocaleDateString()}</td>
                    <td>${user.last_login ? new Date(user.last_login).toLocaleDateString() : '从未登录'}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-primary" onclick="viewUser('${user.id}')">查看</button>
                            <button class="btn btn-sm btn-warning" onclick="resetUserPassword('${user.id}')">重置密码</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUser('${user.id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 搜索用户
        function searchUsers() {
            const searchTerm = document.getElementById('userSearch').value.toLowerCase();
            const filteredUsers = allUsers.filter(user => 
                user.username.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm) ||
                user.id.toLowerCase().includes(searchTerm)
            );
            displayUsers(filteredUsers);
        }

        // 添加用户
        async function addUser() {
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const email = document.getElementById('newEmail').value;

            if (!username || !password) {
                showNotification('用户名和密码不能为空', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        email: email
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('用户添加成功', 'success');
                    hideModal('addUserModal');
                    loadUsersData();
                    
                    // 清空表单
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('newEmail').value = '';
                } else {
                    showNotification('添加用户失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('添加用户失败: ' + error.message, 'error');
            }
        }

        // 服务器管理
        async function loadServersData() {
            try {
                const response = await fetch(`${API_BASE}/servers`);
                const data = await response.json();
                
                if (data.success) {
                    allServers = Object.values(data.servers);
                    displayServers(allServers);
                } else {
                    document.getElementById('serversTable').innerHTML = '<tr><td colspan="7" class="empty-state">加载服务器数据失败</td></tr>';
                }
            } catch (error) {
                document.getElementById('serversTable').innerHTML = `
                    <tr><td colspan="7" class="empty-state">加载失败: ${error.message}</td></tr>
                `;
            }
        }

        function displayServers(servers) {
            const tbody = document.getElementById('serversTable');
            
            if (servers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无服务器</td></tr>';
                return;
            }

            tbody.innerHTML = servers.map(server => `
                <tr>
                    <td>${server.id.substring(0, 8)}...</td>
                    <td>${server.name}</td>
                    <td>${server.creator}</td>
                    <td>${Object.keys(server.users || {}).length}</td>
                    <td>${server.is_encrypted ? '是' : '否'}</td>
                    <td>${new Date(server.created_at).toLocaleDateString()}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-primary" onclick="viewServer('${server.id}')">查看</button>
                            <button class="btn btn-sm btn-warning" onclick="editServer('${server.id}')">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteServer('${server.id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 创建服务器
        async function createServer() {
            const name = document.getElementById('newServerName').value;
            const description = document.getElementById('newServerDescription').value;
            const isEncrypted = document.getElementById('newServerEncrypted').checked;
            const password = isEncrypted ? document.getElementById('newServerPassword').value : null;

            if (!name) {
                showNotification('服务器名称不能为空', 'error');
                return;
            }

            if (isEncrypted && !password) {
                showNotification('加密服务器需要设置密码', 'error');
                return;
            }

            try {
                // 这里需要管理员账户信息，实际使用时需要先登录
                const response = await fetch(`${API_BASE}/servers/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        creator: 'admin', // 需要实际的管理员用户名
                        description: description,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('服务器创建成功', 'success');
                    hideModal('createServerModal');
                    loadServersData();
                    
                    // 清空表单
                    document.getElementById('newServerName').value = '';
                    document.getElementById('newServerDescription').value = '';
                    document.getElementById('newServerEncrypted').checked = false;
                    document.getElementById('newServerPassword').value = '';
                    document.getElementById('newServerPasswordField').style.display = 'none';
                } else {
                    showNotification('创建服务器失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('创建服务器失败: ' + error.message, 'error');
            }
        }

        // 消息统计 - 使用新的API
        async function loadMessagesStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/messages/stats`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('totalMessages').textContent = stats.total_messages;
                    document.getElementById('todayMessages').textContent = stats.today_messages;
                    document.getElementById('privateMessages').textContent = stats.private_messages;
                    document.getElementById('publicMessages').textContent = stats.public_messages;

                    // 显示服务器消息分布
                    const statsContainer = document.getElementById('serverMessagesStats');
                    const serverDistribution = stats.server_distribution;
                    
                    if (Object.keys(serverDistribution).length === 0) {
                        statsContainer.innerHTML = '<div class="empty-state">暂无消息数据</div>';
                    } else {
                        statsContainer.innerHTML = Object.entries(serverDistribution).map(([serverName, messageCount]) => `
                            <div style="margin-bottom: 10px; padding: 10px; background: var(--surface-light); border-radius: 6px;">
                                <div style="display: flex; justify-content: space-between;">
                                    <span>${serverName}</span>
                                    <span>${messageCount} 条消息</span>
                                </div>
                            </div>
                        `).join('');
                    }
                } else {
                    showNotification('加载消息统计失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('加载消息统计失败: ' + error.message, 'error');
            }
        }

        // 删除用户
        async function deleteUser(userId) {
            if (!confirm('确定要删除这个用户吗？此操作会从所有服务器中移除该用户，且不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('用户删除成功', 'success');
                    loadUsersData();
                } else {
                    showNotification('删除用户失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('删除用户失败: ' + error.message, 'error');
            }
        }

        // 删除服务器
        async function deleteServer(serverId) {
            if (!confirm('确定要删除这个服务器吗？此操作会删除服务器所有数据，且不可恢复！')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/servers/${serverId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('服务器删除成功', 'success');
                    loadServersData();
                } else {
                    showNotification('删除服务器失败: ' + data.message, 'error');
                }
            } catch (error) {
                showNotification('删除服务器失败: ' + error.message, 'error');
            }
        }

        // 工具函数
        function showAddUserModal() {
            showModal('addUserModal');
        }

        function showCreateServerModal() {
            showModal('createServerModal');
        }

        function refreshAllData() {
            loadDashboardData();
            if (document.getElementById('users').classList.contains('active')) loadUsersData();
            if (document.getElementById('servers').classList.contains('active')) loadServersData();
            if (document.getElementById('messages').classList.contains('active')) loadMessagesStats();
            showNotification('数据已刷新', 'success');
        }

        // 占位函数
        function viewUser(userId) {
            showNotification('查看用户详情功能开发中', 'info');
        }

        function resetUserPassword(userId) {
            showNotification('重置密码功能开发中', 'info');
        }

        function viewServer(serverId) {
            showNotification('查看服务器功能开发中', 'info');
        }

        function editServer(serverId) {
            showNotification('编辑服务器功能开发中', 'info');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
        });
    </script>
</body>
</html>
